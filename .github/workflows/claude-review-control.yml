name: Claude Review Control

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.event.label.name == 'skip-claude-review' && format('claude-review-{0}', github.event.pull_request.number) || format('claude-review-control-noop-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event.label.name == 'skip-claude-review' }}

jobs:
  cancel-on-skip-label:
    name: Cancel Claude review on skip label
    if: github.event.label.name == 'skip-claude-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record skip label cancellation
        run: |
          echo "skip-claude-review was added; this control run cancels queued or in-flight Claude review work for PR #${{ github.event.pull_request.number }}."

      - name: Mark the sticky comment skipped
        # Cancelling the review workflow also cancels its publish job, so without this the
        # PR keeps claiming a review is queued indefinitely after the author opted out.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STICKY_MARKER: '<!-- claude-pr-review -->'
        shell: bash
        run: |
          set -euo pipefail

          body_file="${RUNNER_TEMP}/claude-review-comment.md"
          json_file="${RUNNER_TEMP}/claude-review-comment.json"

          if ! comment_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-pr-review -->"))) | .id' |
              tail -n 1
          )"; then
            echo "::notice::Could not read the sticky review comment; nothing to mark skipped."
            exit 0
          fi

          if [ -z "$comment_id" ]; then
            echo "No Claude review sticky comment exists for PR #${PR_NUMBER}; nothing to mark skipped."
            exit 0
          fi

          cat > "$body_file" <<EOF
          ${STICKY_MARKER}
          ## Claude Review

          Skipped for commit \`${PR_HEAD_SHA}\` because the \`skip-claude-review\` label was added.

          Remove the label to run a review against the current head.
          EOF

          jq -n --rawfile body "$body_file" '{body: $body}' > "$json_file"

          if ! gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
            --input "$json_file" > /dev/null; then
            echo "::notice::Could not update the sticky review comment to the skipped state."
            exit 0
          fi
